services:
  - type: web
    name: vehicle-benchmark-library
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_DATA_SOURCE
        value: feishu
      - key: VITE_API_BASE_URL
        value: /api
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOW_WRITES
        value: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: WIKI_NODE_TOKEN
        sync: false
      - key: VEHICLE_TABLE_ID
        sync: false
      - key: L1_MARKET_TABLE_ID
        sync: false
      - key: L2_PROFILE_TABLE_ID
        sync: false
      - key: L3_SCENE_TABLE_ID
        sync: false
      - key: L3_FEATURE_TABLE_ID
        sync: false
      - key: L3_STYLING_TABLE_ID
        sync: false
      - key: L4_DESIGN_TABLE_ID
        sync: false
      - key: L5_TRACE_TABLE_ID
        sync: false
      - key: SPECS_TABLE_ID
        sync: false
      - key: BENCHMARK_TABLE_ID
        sync: false
      - key: MEDIA_TABLE_ID
        sync: false
      - key: DISCUSSION_TABLE_ID
        sync: false
      - key: VERSION_TABLE_ID
        sync: false
